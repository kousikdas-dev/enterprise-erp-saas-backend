services:
  postgres:
    image: postgres:16-alpine
    container_name: erp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-erp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-erp_local_only}
      POSTGRES_DB: postgres
    ports:
      # Host port comes from POSTGRES_PORT in .env (local default 15432).
      # Inside the compose network the database always listens on 5432.
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-erp} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: erp-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-erp}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-erp_local_only}
    ports:
      - "${RABBITMQ_PORT:-25672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  identity-service:
    build:
      context: .
      dockerfile: apps/identity-service/Dockerfile
    container_name: erp-identity
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVICE_NAME: identity-service
      NODE_ENV: production
      PORT: 3001
      # Container network hostname; do not use localhost from the host .env.
      DATABASE_URL: postgresql://${POSTGRES_USER:-erp}:${POSTGRES_PASSWORD:-erp_local_only}@postgres:5432/identity_db?schema=public
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-erp}:${RABBITMQ_PASSWORD:-erp_local_only}@rabbitmq:5672
      RABBITMQ_QUEUE: identity.events
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET}
      LOG_LEVEL: info
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  sales-service:
    build:
      context: .
      dockerfile: apps/sales-service/Dockerfile
    container_name: erp-sales
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVICE_NAME: sales-service
      NODE_ENV: production
      PORT: 3002
      DATABASE_URL: postgresql://${POSTGRES_USER:-erp}:${POSTGRES_PASSWORD:-erp_local_only}@postgres:5432/sales_db?schema=public
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-erp}:${RABBITMQ_PASSWORD:-erp_local_only}@rabbitmq:5672
      RABBITMQ_QUEUE: sales.events
      IDENTITY_SERVICE_URL: http://identity-service:3001
      INVENTORY_SERVICE_URL: http://inventory-service:3003
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET}
      LOG_LEVEL: info
    # Internal only. Gateway reaches this at http://sales-service:3002.
    # Do not publish 3002 on the host.
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      identity-service:
        condition: service_started
      inventory-service:
        condition: service_started

  inventory-service:
    build:
      context: .
      dockerfile: apps/inventory-service/Dockerfile
    container_name: erp-inventory
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVICE_NAME: inventory-service
      NODE_ENV: production
      PORT: 3003
      DATABASE_URL: postgresql://${POSTGRES_USER:-erp}:${POSTGRES_PASSWORD:-erp_local_only}@postgres:5432/inventory_db?schema=public
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-erp}:${RABBITMQ_PASSWORD:-erp_local_only}@rabbitmq:5672
      RABBITMQ_QUEUE: inventory.events
      IDENTITY_SERVICE_URL: http://identity-service:3001
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET}
      LOG_LEVEL: info
    # Gateway reaches this at http://inventory-service:3003 (container network).
    # Also published to 127.0.0.1:3003 only (loopback, not LAN-exposed) so the
    # host-run Purchase Service (see purchase-service below) can reach it for
    # internal stock-receipt calls; that endpoint still requires
    # INTERNAL_SERVICE_SECRET, so this does not weaken the internal-only boundary.
    ports:
      - "127.0.0.1:3003:3003"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      identity-service:
        condition: service_started

  accounting-service:
    build:
      context: .
      dockerfile: apps/accounting-service/Dockerfile
    container_name: erp-accounting
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVICE_NAME: accounting-service
      NODE_ENV: production
      PORT: 3004
      DATABASE_URL: postgresql://${POSTGRES_USER:-erp}:${POSTGRES_PASSWORD:-erp_local_only}@postgres:5432/accounting_db?schema=public
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-erp}:${RABBITMQ_PASSWORD:-erp_local_only}@rabbitmq:5672
      RABBITMQ_QUEUE: accounting.events
      LOG_LEVEL: info
    ports:
      - "3004:3004"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  purchase-service:
    build:
      context: .
      dockerfile: apps/purchase-service/Dockerfile
    container_name: erp-purchase
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVICE_NAME: purchase-service
      NODE_ENV: production
      PORT: 3005
      DATABASE_URL: postgresql://${POSTGRES_USER:-erp}:${POSTGRES_PASSWORD:-erp_local_only}@postgres:5432/purchase_db?schema=public
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-erp}:${RABBITMQ_PASSWORD:-erp_local_only}@rabbitmq:5672
      RABBITMQ_QUEUE: purchase.events
      IDENTITY_SERVICE_URL: http://identity-service:3001
      INVENTORY_SERVICE_URL: http://inventory-service:3003
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET}
      LOG_LEVEL: info
    # Internal only. Gateway reaches this at http://purchase-service:3005.
    # Do not publish 3005 on the host.
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      identity-service:
        condition: service_started
      inventory-service:
        condition: service_started

  api-gateway:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    container_name: erp-gateway
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVICE_NAME: api-gateway
      NODE_ENV: production
      PORT: 3000
      IDENTITY_SERVICE_URL: http://identity-service:3001
      SALES_SERVICE_URL: http://sales-service:3002
      INVENTORY_SERVICE_URL: http://inventory-service:3003
      ACCOUNTING_SERVICE_URL: http://accounting-service:3004
      PURCHASE_SERVICE_URL: http://host.docker.internal:3005
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-erp}:${RABBITMQ_PASSWORD:-erp_local_only}@rabbitmq:5672
      LOG_LEVEL: info
    ports:
      - "3000:3000"
    depends_on:
      - identity-service
      - sales-service
      - inventory-service
      - accounting-service
      - purchase-service

volumes:
  postgres_data:
  rabbitmq_data:
