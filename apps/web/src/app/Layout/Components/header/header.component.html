<div [class]="'app-header header-shadow ' + (config$ | async)?.headerTheme">
  <div class="logo-src"></div>
  <div class="app-header__content">
    <div class="app-header-left">
      <a routerLink="/dashboard" class="app-module-label">
        @if (activeModuleBadgeImage(); as badgeImage) {
          <span class="app-module-label__badge app-module-label__badge--default app-module-label__badge--image">
            <img [src]="badgeImage" alt="" />
          </span>
        } @else {
          <span class="app-module-label__badge app-module-label__badge--default" [ngClass]="activeModuleBgClass()">
            <i [class]="activeModuleIcon()"></i>
          </span>
        }
        <span class="app-module-label__badge app-module-label__badge--hover">
          <i class="pe-7s-back"></i>
        </span>
        {{ activeModuleLabel() }}
      </a>
    </div>
    <app-top-navigation></app-top-navigation>
    <div class="app-header-right">
      <app-notifications-box></app-notifications-box>
      <app-messages-box></app-messages-box>
      <app-user-box></app-user-box>
    </div>
  </div>
  <div class="app-header__mobile-menu">
    <button type="button" class="hamburger close-sidebar-btn hamburger--elastic"
            [ngClass]="{'is-active' : globals.toggleSidebarMobile()}" (click)="toggleSidebarMobile()">
        <span class="hamburger-box">
            <span class="hamburger-inner"></span>
        </span>
    </button>
  </div>
  <div class="app-header__menu">
    <span>
        <button class="btn-icon btn-icon-only btn btn-primary" [ngClass]="{'is-active' : globals.toggleHeaderMobile()}"
                (click)="toggleHeaderMobile()">
            <div class="btn-icon-wrapper">
                <fa-icon [icon]="faEllipsisV"></fa-icon>
            </div>
        </button>
    </span>
  </div>
</div>
