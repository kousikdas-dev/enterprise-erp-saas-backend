<div ngbDropdown container="body">
  <button
    type="button"
    class="btn btn-sm btn-link p-0 card-header-settings"
    ngbDropdownToggle
    [attr.aria-label]="label + ' actions'">
    <i class="pe-7s-config"></i>
  </button>
  <div ngbDropdownMenu>
    <button type="button" class="dropdown-item" disabled title="Will be implemented in a future phase.">
      <i class="pe-7s-cloud-download me-2"></i>Import
    </button>
    <button type="button" class="dropdown-item" disabled title="Will be implemented in a future phase.">
      <i class="pe-7s-cloud-upload me-2"></i>Export
    </button>
    <div class="dropdown-divider"></div>
    <button type="button" class="dropdown-item" disabled title="Will be implemented in a future phase.">
      <i class="pe-7s-notebook me-2"></i>Knowledge
    </button>
    <button type="button" class="dropdown-item" disabled title="Will be implemented in a future phase.">
      <i class="pe-7s-graph me-2"></i>Dashboard
    </button>
    <button type="button" class="dropdown-item" disabled title="Will be implemented in a future phase.">
      <i class="pe-7s-file me-2"></i>Spreadsheet
    </button>
  </div>
</div>
