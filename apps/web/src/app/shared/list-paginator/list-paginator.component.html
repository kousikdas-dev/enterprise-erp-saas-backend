@if (totalItems > 0) {
  <div class="list-paginator d-flex align-items-center gap-2">
    <span class="list-paginator__range text-muted small">{{ rangeStart }}-{{ rangeEnd }} / {{ totalItems }}</span>
    <div class="btn-group btn-group-sm" role="group" aria-label="Pagination">
      <button
        type="button"
        class="btn btn-outline-secondary"
        (click)="prev()"
        [disabled]="currentPage <= 1"
        data-bs-toggle="tooltip"
        data-bs-placement="bottom"
        title="Previous page"
        aria-label="Previous page">
        <i class="pe-7s-angle-left"></i>
      </button>
      <button
        type="button"
        class="btn btn-outline-secondary"
        (click)="next()"
        [disabled]="currentPage >= totalPages"
        data-bs-toggle="tooltip"
        data-bs-placement="bottom"
        title="Next page"
        aria-label="Next page">
        <i class="pe-7s-angle-right"></i>
      </button>
    </div>

    <div class="btn-group btn-group-sm list-view-switcher" role="group" aria-label="Views">
      <button
        type="button"
        class="btn btn-outline-secondary active"
        data-bs-toggle="tooltip"
        data-bs-placement="bottom"
        title="List view"
        aria-label="List view">
        <i class="pe-7s-menu"></i>
      </button>
      <button
        type="button"
        class="btn btn-outline-secondary btn-view-placeholder"
        aria-disabled="true"
        data-bs-toggle="tooltip"
        data-bs-placement="bottom"
        title="Will be implemented in a future phase."
        aria-label="Kanban view">
        <i class="pe-7s-display2"></i>
      </button>
      <button
        type="button"
        class="btn btn-outline-secondary btn-view-placeholder"
        aria-disabled="true"
        data-bs-toggle="tooltip"
        data-bs-placement="bottom"
        title="Will be implemented in a future phase."
        aria-label="Map view">
        <i class="pe-7s-map"></i>
      </button>
      <button
        type="button"
        class="btn btn-outline-secondary btn-view-placeholder"
        aria-disabled="true"
        data-bs-toggle="tooltip"
        data-bs-placement="bottom"
        title="Will be implemented in a future phase."
        aria-label="Calendar view">
        <i class="pe-7s-date"></i>
      </button>
      <button
        type="button"
        class="btn btn-outline-secondary btn-view-placeholder"
        aria-disabled="true"
        data-bs-toggle="tooltip"
        data-bs-placement="bottom"
        title="Will be implemented in a future phase."
        aria-label="Pivot view">
        <i class="pe-7s-note2"></i>
      </button>
      <button
        type="button"
        class="btn btn-outline-secondary btn-view-placeholder"
        aria-disabled="true"
        data-bs-toggle="tooltip"
        data-bs-placement="bottom"
        title="Will be implemented in a future phase."
        aria-label="Graph view">
        <i class="pe-7s-graph1"></i>
      </button>
      <button
        type="button"
        class="btn btn-outline-secondary btn-view-placeholder"
        aria-disabled="true"
        data-bs-toggle="tooltip"
        data-bs-placement="bottom"
        title="Will be implemented in a future phase."
        aria-label="Activity view">
        <i class="pe-7s-alarm"></i>
      </button>
    </div>
  </div>
}
