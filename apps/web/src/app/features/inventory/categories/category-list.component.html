<div class="main-card mb-3 card">
  <div class="card-header d-flex flex-wrap gap-2 align-items-center justify-content-between">
    <div class="card-header-title">Categories</div>
    <div class="d-flex flex-wrap gap-2">
      <input
        type="search"
        class="form-control form-control-sm"
        style="min-width: 200px;"
        placeholder="Filter by name…"
        [ngModel]="filter()"
        (ngModelChange)="filter.set($event)" />
      <button type="button" class="btn btn-sm btn-outline-secondary" (click)="load()" [disabled]="loading()">
        Refresh
      </button>
      <button
        *ngIf="canCreate"
        type="button"
        class="btn btn-sm btn-success"
        (click)="openCreate()">
        Create Category
      </button>
    </div>
  </div>

  <div class="card-body">
    <app-list-state
      [loading]="loading()"
      [error]="error()"
      [empty]="!filtered().length"
      emptyMessage="No categories yet. Create one to get started."
      (retry)="load()">
      <div class="table-responsive">
        <table class="align-middle mb-0 table table-borderless table-striped table-hover">
          <thead>
            <tr>
              <th>Name</th>
              <th>Description</th>
              <th class="text-center">Status</th>
              <th class="text-end">Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let item of filtered()">
              <td>
                <div class="widget-heading">{{ item.name }}</div>
              </td>
              <td class="text-muted">{{ item.description || '—' }}</td>
              <td class="text-center">
                <span class="badge" [class.bg-success]="item.isActive" [class.bg-secondary]="!item.isActive">
                  {{ item.isActive ? 'Active' : 'Inactive' }}
                </span>
              </td>
              <td class="text-end">
                <button
                  *ngIf="canUpdate"
                  type="button"
                  class="btn btn-sm btn-outline-primary"
                  (click)="openEdit(item)">
                  Edit
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </app-list-state>
  </div>
</div>

<ng-template #formModal let-modal>
  <div class="modal-header">
    <h5 class="modal-title">{{ editing ? 'Edit Category' : 'Create Category' }}</h5>
    <button type="button" class="btn-close" aria-label="Close" (click)="modal.dismiss()"></button>
  </div>
  <form [formGroup]="form" (ngSubmit)="save()">
    <div class="modal-body">
      <div class="mb-3">
        <label class="form-label" for="catName">Name</label>
        <input id="catName" class="form-control" formControlName="name" maxlength="120" />
        <div class="text-danger small" *ngIf="form.controls.name.touched && form.controls.name.invalid">
          Name is required (max 120 characters).
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label" for="catDesc">Description</label>
        <textarea id="catDesc" class="form-control" rows="3" formControlName="description" maxlength="255"></textarea>
      </div>
      <div class="form-check" *ngIf="editing">
        <input class="form-check-input" type="checkbox" id="catActive" formControlName="isActive" />
        <label class="form-check-label" for="catActive">Active</label>
      </div>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-link" (click)="modal.dismiss()">Cancel</button>
      <button type="submit" class="btn btn-primary" [disabled]="saving() || form.invalid">
        {{ saving() ? 'Saving…' : 'Save' }}
      </button>
    </div>
  </form>
</ng-template>
