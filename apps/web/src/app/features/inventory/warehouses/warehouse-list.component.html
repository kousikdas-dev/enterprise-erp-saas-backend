<app-page-title
  heading="Warehouses"
  subheading="Warehouse locations"
  icon="pe-7s-home"
  [showActions]="false">
</app-page-title>

<div class="main-card mb-3 card">
  <div class="card-header d-flex flex-wrap gap-2 align-items-center justify-content-between">
    <div class="card-header-title">Warehouses</div>
    <div class="d-flex flex-wrap gap-2">
      <input
        type="search"
        class="form-control form-control-sm"
        style="min-width: 200px;"
        placeholder="Filter…"
        [(ngModel)]="filter" />
      <button type="button" class="btn btn-sm btn-outline-secondary" (click)="load()" [disabled]="loading">
        Refresh
      </button>
      <button *ngIf="canCreate" type="button" class="btn btn-sm btn-success" (click)="openCreate()">
        Create Warehouse
      </button>
    </div>
  </div>

  <div class="card-body">
    <app-list-state
      [loading]="loading"
      [error]="error"
      [empty]="!filtered.length"
      emptyMessage="No warehouses yet. Create one to get started."
      (retry)="load()">
      <div class="table-responsive">
        <table class="align-middle mb-0 table table-borderless table-striped table-hover">
          <thead>
            <tr>
              <th>Code</th>
              <th>Name</th>
              <th>Address</th>
              <th class="text-center">Status</th>
              <th class="text-end">Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let item of filtered">
              <td><code>{{ item.code }}</code></td>
              <td>{{ item.name }}</td>
              <td class="text-muted">{{ item.address || '—' }}</td>
              <td class="text-center">
                <span class="badge" [class.bg-success]="item.isActive" [class.bg-secondary]="!item.isActive">
                  {{ item.isActive ? 'Active' : 'Inactive' }}
                </span>
              </td>
              <td class="text-end">
                <button
                  *ngIf="canUpdate"
                  type="button"
                  class="btn btn-sm btn-outline-primary"
                  (click)="openEdit(item)">
                  Edit
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </app-list-state>
  </div>
</div>

<ng-template #formModal let-modal>
  <div class="modal-header">
    <h5 class="modal-title">{{ editing ? 'Edit Warehouse' : 'Create Warehouse' }}</h5>
    <button type="button" class="btn-close" aria-label="Close" (click)="modal.dismiss()"></button>
  </div>
  <form [formGroup]="form" (ngSubmit)="save()">
    <div class="modal-body">
      <div class="mb-3">
        <label class="form-label" for="whCode">Code</label>
        <input id="whCode" class="form-control" formControlName="code" maxlength="32" />
        <div class="text-danger small" *ngIf="form.controls.code.touched && form.controls.code.invalid">
          Code is required (max 32 characters).
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label" for="whName">Name</label>
        <input id="whName" class="form-control" formControlName="name" maxlength="120" />
        <div class="text-danger small" *ngIf="form.controls.name.touched && form.controls.name.invalid">
          Name is required (max 120 characters).
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label" for="whAddress">Address</label>
        <input id="whAddress" class="form-control" formControlName="address" maxlength="255" />
      </div>
      <div class="form-check" *ngIf="editing">
        <input class="form-check-input" type="checkbox" id="whActive" formControlName="isActive" />
        <label class="form-check-label" for="whActive">Active</label>
      </div>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-link" (click)="modal.dismiss()">Cancel</button>
      <button type="submit" class="btn btn-primary" [disabled]="saving || form.invalid">
        {{ saving ? 'Saving…' : 'Save' }}
      </button>
    </div>
  </form>
</ng-template>
