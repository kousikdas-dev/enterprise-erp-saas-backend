<div class="vh-100 bg-plum-plate bg-animation">
  <div class="d-flex h-100 justify-content-center align-items-center p-3">
    <div class="w-100 app-login-box" style="max-width: 500px;">
      <!-- Logo -->
      <div class="app-logo-inverse mx-auto mb-4 d-block" style="width: 60px; height: 60px; background-size: contain; background-repeat: no-repeat; background-position: center;"></div>

      <!-- Login Card -->
      <div class="card shadow-lg border-0">
        <div class="card-body p-4 p-md-5">
          <!-- Header -->
          <div class="text-center mb-4">
            <h3 class="mb-2 fw-normal">Welcome back,</h3>
            <p class="text-muted mb-0">Please sign in to your account below.</p>
          </div>

          <div *ngIf="errorMessage" class="alert alert-danger" role="alert">
            {{ errorMessage }}
          </div>

          <!-- Login Form -->
          <form id="loginForm" (ngSubmit)="onSubmit(loginFormRef)" #loginFormRef="ngForm">
            <div class="mb-3">
              <label for="tenantCodeInput" class="form-label visually-hidden">Tenant code</label>
              <input
                id="tenantCodeInput"
                type="text"
                class="form-control form-control-lg"
                placeholder="Tenant code..."
                name="tenantCode"
                [(ngModel)]="tenantCode"
                required
                autocomplete="organization">
            </div>

            <div class="mb-3">
              <label for="emailInput" class="form-label visually-hidden">Email address</label>
              <input
                id="emailInput"
                type="email"
                class="form-control form-control-lg"
                placeholder="Enter email..."
                name="email"
                [(ngModel)]="email"
                required
                autocomplete="email">
            </div>

            <div class="mb-3">
              <label for="passwordInput" class="form-label visually-hidden">Password</label>
              <input
                id="passwordInput"
                type="password"
                class="form-control form-control-lg"
                placeholder="Enter password..."
                name="password"
                [(ngModel)]="password"
                required
                autocomplete="current-password">
            </div>
          </form>
        </div>

        <!-- Footer with buttons -->
        <div class="card-footer bg-transparent border-0 p-4 pt-0">
          <div class="d-flex flex-column flex-sm-row justify-content-end gap-2">
            <button
              type="submit"
              class="btn btn-primary btn-lg px-4"
              form="loginForm"
              [disabled]="submitting || loginFormRef.invalid">
              {{ submitting ? 'Signing in...' : 'Login' }}
            </button>
          </div>
        </div>
      </div>

      <!-- Copyright -->
      <div class="text-center text-white mt-4">
        <p class="mb-0 opacity-75 small">
          Copyright © ArchitectUI 2026
        </p>
      </div>
    </div>
  </div>
</div>
